name: EcoTrack AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4.0.3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 📱 Mobile App TypeScript Verification
        run: |
          cd frontend
          npx tsc --noEmit

      - name: 🔍 Mobile App ESLint Verification
        run: |
          cd frontend
          npm run lint

      - name: 🧪 Execute QA Automated Test Suite & Generate Reports
        run: |
          cd testing
          node run_all_tests.js

      - name: 📊 Upload QA Test Reports (Excel, HTML, PDF)
        uses: actions/upload-artifact@v4.3.4
        with:
          name: EcoTrack-Test-Reports
          path: |
            testing/EcoTrack_Test_Suite_Report.csv
            testing/EcoTrack_Test_Suite_Report.html
            testing/EcoTrack_Test_Suite_Report.pdf
