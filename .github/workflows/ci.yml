name: EcoTrack AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4.0.3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 📱 Mobile App TypeScript Verification
        run: |
          cd frontend
          npx tsc --noEmit

      - name: 🔍 Mobile App ESLint Verification
        run: |
          cd frontend
          npm run lint

      - name: 🧪 Execute QA Automated Test Suite & Generate Reports
        run: |
          cd testing
          node run_all_tests.js

      - name: 📊 GitHub Actions Job Summary
        if: always()
        run: |
          echo "## 🔬 EcoTrack QA Automation Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f testing/EcoTrack_Test_Suite_Report.csv ]; then
            # Simple way to get counts since we know the structure
            TOTAL=$(tail -n +2 testing/EcoTrack_Test_Suite_Report.csv | wc -l)
            PASSED=$(grep -c "\"PASS\"" testing/EcoTrack_Test_Suite_Report.csv || echo "0")
            FAILED=$(grep -c "\"FAIL\"" testing/EcoTrack_Test_Suite_Report.csv || echo "0")
            
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | ✅ $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ❌ $FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📈 Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'testing/EcoTrack_Test_Suite_Report.xml'
          check_name: 'QA Test Results'

      - name: 📊 Upload QA Test Reports (Excel, HTML, PDF, XML)
        uses: actions/upload-artifact@v4.3.4
        with:
          name: EcoTrack-Test-Reports
          path: |
            testing/EcoTrack_Test_Suite_Report.csv
            testing/EcoTrack_Test_Suite_Report.html
            testing/EcoTrack_Test_Suite_Report.pdf
            testing/EcoTrack_Test_Suite_Report.xml
