name: EcoTrack Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Repository Checkout
        uses: actions/checkout@v4

      - name: 2. Dependency Installation
        run: |
          npm install
          cd frontend && npm install || true
          cd ../backend && npm install || true

      - name: 3. Application Build
        run: |
          # Build website/frontend if needed
          echo "Building application..."
          mkdir -p build
          cp -r website/* build/

      - name: 4. Static Analysis
        run: |
          echo "Running Static Analysis..."
          # Example: npx eslint . --ext .js || true
          npx tsc --noEmit --project frontend/tsconfig.json || echo "TypeScript check skipped or failed"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: 5. GitHub Pages Deployment
        id: deployment
        uses: actions/deploy-pages@v4

  testing-and-reporting:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: 1. Repository Checkout
        uses: actions/checkout@v4

      - name: 2. Dependency Installation
        run: |
          npm install
          # Install any specific test dependencies
          # npm install selenium-webdriver axe-core

      - name: 6. Deployment Wait and Verification
        run: |
          BASE_URL="${{ needs.build-and-deploy.outputs.page_url }}"
          if [ -z "$BASE_URL" ]; then BASE_URL="https://sasikumars254.github.io/EcoTrackApp"; fi
          echo "Verifying deployment at $BASE_URL"
          until curl -sLf "$BASE_URL" > /dev/null; do
            echo "Waiting for deployment..."
            sleep 10
          done
          echo "Deployment verified!"

      - name: Run Unified Automation Suite (Stages 7-11)
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.page_url }}
        run: |
          cd automation
          npm install
          node run_pipeline.js

      - name: 12. Artifact Uploading
        uses: actions/upload-artifact@v4
        with:
          name: EcoTrack-Test-Results
          path: automation/reports/
          retention-days: 30

      - name: 13. GitHub Actions Job Summary Publishing
        if: always()
        run: |
          echo "## 🔬 EcoTrack Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "Deployment URL: ${{ needs.build-and-deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          
          # Extract stats from full_results.json if it exists
          if [ -f automation/reports/full_results.json ]; then
            TOTAL=$(jq '. | length' automation/reports/full_results.json)
            PASSED=$(jq '[.[] | select(.status=="PASS")] | length' automation/reports/full_results.json)
            FAILED=$(jq '[.[] | select(.status=="FAIL")] | length' automation/reports/full_results.json)
            BLOCKED=$(jq '[.[] | select(.status=="BLOCKED")] | length' automation/reports/full_results.json)
            
            echo "### 📊 Statistics" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | ✅ $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ❌ $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| Blocked | ⚠️ $BLOCKED |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📋 Reports" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts:** Download the 'EcoTrack-Test-Results' artifact for detailed Excel and HTML dashboards." >> $GITHUB_STEP_SUMMARY
          echo "- **Native View:** See the 'Tests' tab at the top of this run for detailed pass/fail status." >> $GITHUB_STEP_SUMMARY

      - name: 14. Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'automation/reports/junit_results.xml'
          check_name: 'Detailed Test Results'
