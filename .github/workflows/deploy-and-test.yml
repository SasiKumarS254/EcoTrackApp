name: Enterprise CI/CD Deployment & E2E Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Web Application
        working-directory: ./frontend
        run: npx expo export --platform web

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e-testing:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './automation/package-lock.json'

      - name: Install Automation Dependencies
        working-directory: ./automation
        run: npm install

      - name: Deployment Verification
        run: |
          echo "Verifying deployment at ${{ needs.build-and-deploy.outputs.page_url }}"
          curl -f ${{ needs.build-and-deploy.outputs.page_url }} || (echo "Deployment not ready" && exit 1)

      - name: Run Selenium E2E Tests (300 cases)
        working-directory: ./automation
        continue-on-error: true
        run: npm run test:web
        env:
          TARGET_URL: ${{ needs.build-and-deploy.outputs.page_url }}

      - name: Run Appium Mobile Tests (300 cases)
        working-directory: ./automation
        continue-on-error: true
        run: npm run test:mobile

      - name: Run Vulnerability Assessment (300 cases)
        working-directory: ./automation
        continue-on-error: true
        run: npm run test:security

      - name: Run Load & Performance Tests (300 cases)
        working-directory: ./automation
        continue-on-error: true
        run: npm run test:load

      - name: Generate Enterprise Reports
        working-directory: ./automation
        if: always()
        run: npm run report:generate

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Automation-Reports
          path: |
            automation/reports/Excel/
            automation/reports/HTML/
            automation/reports/JSON/
            automation/reports/Summary/
          retention-days: 30

      - name: Publish GitHub Summary
        if: always()
        run: |
          cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
